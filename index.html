<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14212B">
<title>MjrFts</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#14212B; --muted:#56636E; --line:#D3DAE0;
  --accent:#F2A900; --accent-ink:#1A1300; --stage:#0B1115; --ok:#2E9E5B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E161C; --surface:#17222A; --ink:#EEF2F5; --muted:#97A5B0; --line:#2B3944; --accent:#FFB81C; --ok:#4CC27E; }
}
:root[data-theme="dark"]{ --bg:#0E161C; --surface:#17222A; --ink:#EEF2F5; --muted:#97A5B0; --line:#2B3944; --accent:#FFB81C; --ok:#4CC27E; }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.cond{font-family:"Roboto Condensed","sans-serif-condensed","Arial Narrow",sans-serif}
.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px}
.brand{flex:1;display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.3px}
.ver{font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--bg)}
.count{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbtn{position:relative;display:inline-flex;align-items:center;justify-content:center;font:inherit;font-weight:600;font-size:15px;padding:9px 13px;border-radius:9px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;overflow:hidden;white-space:nowrap}
.fbtn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fbtn:disabled{opacity:.45}
.fbtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}
.stage{position:relative;flex:1;min-height:0;background:var(--stage)}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#C9D3DA;padding:28px;gap:10px;font-size:17px}
.empty b{color:#fff;font-size:20px}
/* carrusel */
.car{position:absolute;inset:0;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:10px 11%;overscroll-behavior-x:contain}
.card{position:relative;flex:none;touch-action:manipulation;width:100%;height:100%;scroll-snap-align:center;border-radius:12px;overflow:hidden;background:#000;border:3px solid transparent;user-select:none;-webkit-user-select:none}
.card.off{opacity:.45}
.card canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.card .chk{position:absolute;left:8px;top:8px;z-index:2;display:flex;align-items:center;gap:6px;background:rgba(10,16,22,.75);color:#fff;padding:7px 11px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer}
.card .chk input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.card .st{position:absolute;right:8px;top:8px;z-index:2;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.card .st.ok{background:var(--ok);color:#fff}
.card .foot{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:14px}
.card .foot button{font:inherit;font-weight:700;font-size:14px;padding:8px 12px;border-radius:999px;border:0;background:#fff;color:#14212B;cursor:pointer}
/* detalle */
.det{position:absolute;inset:0;background:var(--stage);z-index:3;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.det canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.bar{position:absolute;left:0;right:0;display:flex;align-items:center;gap:6px;padding:8px;z-index:4;pointer-events:none}
.bar>*{pointer-events:auto}
.bar.t{top:0;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.bar.b{bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.7));justify-content:center;flex-wrap:wrap}
.pill{font:inherit;font-weight:600;font-size:14px;padding:9px 13px;border-radius:999px;border:0;background:rgba(10,16,22,.78);color:#fff;cursor:pointer;white-space:nowrap}
.pill.on,.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pill:disabled{opacity:.4}
.pos{color:#fff;font-weight:700;font-size:15px;margin:0 auto}
.msg{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;padding:6px 12px;border-radius:8px;z-index:4;pointer-events:none;white-space:nowrap}
/* panel */
.panel{height:206px;flex:none;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;font:inherit;font-weight:600;font-size:15px;padding:10px 4px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-weight:600;font-size:14px;padding:9px 12px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sl{margin:0 2px 10px}
.sl .r{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
.sl output{color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:30px;accent-color:var(--accent);margin:0}
.sum{font-size:15px;margin:0 0 10px}
.sum b{font-size:17px}
.warn{color:#B06A00;font-size:14px;margin:6px 0 0}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}
button:focus-visible,.fbtn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.busy{position:fixed;inset:0;background:rgba(10,16,22,.7);display:none;align-items:center;justify-content:center;z-index:9;color:#fff;font-size:18px;font-weight:600;text-align:center;padding:24px}
.busy.on{display:flex}
.toast{position:fixed;left:50%;bottom:calc(218px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:8;text-align:center}
.toast.on{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><h1 class="cond">MjrFts</h1><span class="ver" id="ver">v1</span><span class="count" id="count"></span></div>
    <label class="fbtn main">Elegir fotos<input type="file" id="pick" accept="image/*" multiple></label>
  </div>

  <div class="stage" id="stage">
    <div class="empty" id="empty"><b>Sin fotos todavía</b>Toca <b style="font-size:inherit">Elegir fotos</b> y marca todas las del trabajo.</div>
    <div class="car" id="car" hidden></div>

    <div class="det" id="det" hidden>
      <canvas id="dc"></canvas>
      <div class="bar t">
        <button class="pill" id="dClose">✕ Cerrar</button>
        <span class="pos" id="dPos"></span>
        <button class="pill" id="dInc" aria-pressed="true">✓ Incluida</button>
      </div>
      <div class="msg" id="dMsg" hidden>Arrastra el dedo sobre el display</div>
      <div class="bar b">
        <button class="pill" id="dPrev">◀</button>
        <button class="pill" id="dEdit" aria-pressed="false">Editar recuadro</button>
        <button class="pill" id="dClear">Quitar recuadro</button>
        <button class="pill" id="dOrig">Mantén: original</button>
        <button class="pill" id="dNext">▶</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-p="pF">Filtros</button>
      <button class="tab" role="tab" aria-selected="false" data-p="pA">Ajuste fino</button>
      <button class="tab" role="tab" aria-selected="false" data-p="pG">Guardar</button>
    </div>
    <div class="pane" id="pF"><div class="chips" id="chips"></div><p class="note">El filtro se aplica igual a todas las fotos.</p></div>
    <div class="pane" id="pA" hidden></div>
    <div class="pane" id="pG" hidden>
      <p class="sum" id="sum"></p>
      <button class="fbtn main" id="bSave" style="width:100%;padding:12px" disabled>Guardar</button>
      <p class="warn" id="sWarn" hidden></p>
      <p class="note">Las fotos nuevas se guardan aparte, con "_mjr" en el nombre. Las originales no se tocan.</p>
    </div>
  </div>
</div>
<div class="busy" id="busy"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const VERSION=1;
document.getElementById('ver').textContent='v'+VERSION;

const $=id=>document.getElementById(id);
const THUMB_MAX=900, WORK_MAX=2000, SAVE_MAX=4800;
const PRESETS=[
  {id:'nitido',name:'Extra nítido', fondo:25,gm:75, nit:150,hi:95},
  {id:'local', name:'Local',        fondo:25,gm:100,nit:60, hi:95},
  {id:'claro', name:'Claro',        fondo:25,gm:75, nit:60, hi:95},
  {id:'muy',   name:'Muy claro',    fondo:15,gm:75, nit:80, hi:92},
  {id:'doble', name:'Doble escala', fondo:30,gm:80, nit:80, hi:95,doble:true},
  {id:'rojo',  name:'Canal rojo',   fondo:25,gm:80, nit:60, hi:95,rojo:true},
  {id:'amplio',name:'Fondo amplio', fondo:40,gm:80, nit:60, hi:97},
  {id:'inv',   name:'Invertido',    fondo:25,gm:75, nit:60, hi:95,inv:true}
];
const SL=[
  {k:'fondo',label:'Quitar reflejo',     min:5, max:60, step:1},
  {k:'gm',   label:'Oscurecer dígitos',  min:50,max:200,step:1},
  {k:'nit',  label:'Nitidez',            min:0, max:200,step:1},
  {k:'hi',   label:'Dejar pasar brillos',min:85,max:100,step:0.5}
];
const TG=[{k:'doble',label:'Doble escala'},{k:'rojo',label:'Canal rojo'},{k:'inv',label:'Invertir'}];

let photos=[];           // {file, thumb, inc, reg:{x,y,w,h} 0..1, el, cv, st, ck}
let presetId='nitido', P={...PRESETS[0]};
let cur=-1, work=null, comp=null;

const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
function toast(m,ms){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),ms||2800);}
function busy(m){const b=$('busy');if(m){b.textContent=m;b.classList.add('on');}else b.classList.remove('on');}
const frame=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- decodificar ---------- */
function decode(f){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(f), i=new Image();
    i.onload=()=>{URL.revokeObjectURL(u);res(i);};
    i.onerror=()=>{URL.revokeObjectURL(u);if(window.createImageBitmap)createImageBitmap(f).then(res,rej);else rej(new Error('formato'));};
    i.src=u;
  });
}
async function toCanvas(f,max){
  const img=await decode(f), w=img.naturalWidth||img.width, h=img.naturalHeight||img.height, s=Math.min(1,max/Math.max(w,h));
  const c=mk(Math.round(w*s),Math.round(h*s)), x=c.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(img,0,0,c.width,c.height);
  if(img.close) img.close();
  return c;
}

/* ---------- filtro ---------- */
function box(src,w,h,r){
  r=Math.max(1,Math.round(r)); const n=2*r+1, tmp=new Float32Array(src.length), out=new Float32Array(src.length);
  for(let y=0;y<h;y++){const o=y*w;let s=0;for(let i=-r;i<=r;i++)s+=src[o+Math.min(w-1,Math.max(0,i))];
    for(let x=0;x<w;x++){tmp[o+x]=s/n;s+=src[o+Math.min(w-1,x+r+1)]-src[o+Math.max(0,x-r)];}}
  for(let x=0;x<w;x++){let s=0;for(let i=-r;i<=r;i++)s+=tmp[Math.min(h-1,Math.max(0,i))*w+x];
    for(let y=0;y<h;y++){out[y*w+x]=s/n;s+=tmp[Math.min(h-1,y+r+1)*w+x]-tmp[Math.max(0,y-r)*w+x];}}
  return out;
}
const gblur=(a,w,h,sg)=>box(box(box(a,w,h,sg),w,h,sg),w,h,sg);
function pcts(a,lo,hi){
  const step=Math.max(1,Math.floor(a.length/60000)), s=[];
  for(let i=0;i<a.length;i+=step)s.push(a[i]); s.sort((p,q)=>p-q);
  const g=p=>s[Math.min(s.length-1,Math.max(0,Math.floor(p/100*(s.length-1))))];
  return [g(lo),g(hi)];
}
function processRGBA(d,w,h,p){
  const n=w*h, ch=new Float32Array(n);
  for(let i=0,j=0;j<n;i+=4,j++) ch[j]=p.rojo?d[i]:0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
  const bg=gblur(ch,w,h,Math.max(2,h*p.fondo/100));
  const F=new Float32Array(n); for(let j=0;j<n;j++)F[j]=ch[j]-bg[j];
  if(p.doble){const b2=gblur(ch,w,h,Math.max(1.5,h*0.08));for(let j=0;j<n;j++)F[j]=0.5*F[j]+0.5*(ch[j]-b2[j]);}
  const [lo,hi]=pcts(F,2,Math.min(99.9,p.hi)), rng=(hi-lo)||1, gm=p.gm/100;
  for(let j=0;j<n;j++){let v=(F[j]-lo)/rng; v=v<0?0:v>1?1:v; F[j]=255*Math.pow(v,gm);}
  const amt=p.nit/100;
  if(amt>0){const b=gblur(F,w,h,Math.max(1.5,h/90));for(let j=0;j<n;j++){const v=F[j]+amt*(F[j]-b[j]);F[j]=v<0?0:v>255?255:v;}}
  if(p.inv) for(let j=0;j<n;j++)F[j]=255-F[j];
  return F;
}
// Devuelve un lienzo nuevo: la foto con solo el recuadro procesado
function compose(base,reg,p){
  const out=mk(base.width,base.height), x=out.getContext('2d',{willReadFrequently:true});
  x.drawImage(base,0,0);
  if(!reg) return out;
  const rx=Math.round(reg.x*base.width), ry=Math.round(reg.y*base.height);
  const rw=Math.max(4,Math.min(base.width-rx,Math.round(reg.w*base.width))), rh=Math.max(4,Math.min(base.height-ry,Math.round(reg.h*base.height)));
  const id=x.getImageData(rx,ry,rw,rh), d=id.data, F=processRGBA(d,rw,rh,p);
  for(let i=0,j=0;j<F.length;i+=4,j++){const v=F[j];d[i]=d[i+1]=d[i+2]=v;}
  x.putImageData(id,rx,ry);
  return out;
}

/* ---------- elegir fotos ---------- */
const pick=$('pick');
pick.addEventListener('change',async()=>{
  const files=[...(pick.files||[])]; setTimeout(()=>{pick.value='';},0);
  if(!files.length) return;
  if(photos.length && !confirm('¿Reemplazar las '+photos.length+' fotos actuales por las nuevas?')) return;
  closeDetail(); photos=[]; $('car').innerHTML='';
  let bad=0;
  for(let i=0;i<files.length;i++){
    busy('Cargando foto '+(i+1)+' de '+files.length+'…'); await frame();
    try{ const thumb=await toCanvas(files[i],THUMB_MAX); photos.push({file:files[i],thumb,inc:true,reg:null}); }
    catch(e){ bad++; }
  }
  busy();
  buildCarousel();
  if(bad) toast(bad+' foto(s) no se pudieron abrir y se omitieron.',4000);
});

/* ---------- carrusel ---------- */
function buildCarousel(){
  const car=$('car'); car.innerHTML='';
  $('empty').hidden=photos.length>0; car.hidden=!photos.length;
  photos.forEach((ph,i)=>{
    const el=document.createElement('div'); el.className='card';
    const cv=mk(1,1);
    const ck=document.createElement('label'); ck.className='chk';
    ck.innerHTML='<input type="checkbox" checked><span>Incluir</span>';
    const st=document.createElement('span'); st.className='st';
    const foot=document.createElement('div'); foot.className='foot';
    foot.innerHTML='<span>Foto '+(i+1)+' de '+photos.length+' · doble toque para abrir</span><button>Abrir</button>';
    el.append(cv,ck,st,foot); car.appendChild(el);
    Object.assign(ph,{el,cv,st,ck:ck.querySelector('input')});
    ph.ck.addEventListener('change',()=>{ph.inc=ph.ck.checked;refreshCard(i,false);updateSummary();});
    foot.querySelector('button').onclick=()=>openDetail(i);
    let last=0;
    el.addEventListener('click',e=>{
      if(e.target.closest('.chk')||e.target.closest('button')) return;
      const now=Date.now(); if(now-last<350){last=0;openDetail(i);} else last=now;
    });
    refreshCard(i,true);
  });
  updateSummary();
}
function refreshCard(i,redraw){
  const ph=photos[i]; if(!ph||!ph.el) return;
  if(redraw){const c=compose(ph.thumb,ph.reg,P); ph.cv.width=c.width; ph.cv.height=c.height; ph.cv.getContext('2d').drawImage(c,0,0);}
  ph.el.classList.toggle('off',!ph.inc);
  ph.st.className='st'+(ph.reg?' ok':''); ph.st.textContent=ph.reg?'✓ Recuadro':'Sin recuadro';
  ph.ck.checked=ph.inc;
}
let rAll=0;
function refreshAll(){clearTimeout(rAll);rAll=setTimeout(()=>{photos.forEach((_,i)=>refreshCard(i,true));},150);}

/* ---------- detalle (foto 1x1) ---------- */
const det=$('det'), dc=$('dc');
let V={z:1,px:0,py:0}, edit=false, showOrig=false, drawRect=null;
async function openDetail(i){
  if(i<0||i>=photos.length) return;
  busy('Abriendo…'); await frame();
  try{ work=await toCanvas(photos[i].file,WORK_MAX); }catch(e){ busy(); toast('No se pudo abrir la foto'); return; }
  cur=i; comp=compose(work,photos[i].reg,P);
  V={z:1,px:0,py:0}; setEdit(false);
  det.hidden=false; busy(); sizeDet(); updDetUI();
  photos[i].el.scrollIntoView({inline:'center',block:'nearest'});
}
function closeDetail(){det.hidden=true;cur=-1;work=null;comp=null;setEdit(false);}
function updDetUI(){
  const ph=photos[cur]; if(!ph) return;
  $('dPos').textContent=(cur+1)+' / '+photos.length;
  $('dInc').setAttribute('aria-pressed',ph.inc); $('dInc').textContent=ph.inc?'✓ Incluida':'Excluida';
  $('dPrev').disabled=cur===0; $('dNext').disabled=cur===photos.length-1;
  $('dClear').disabled=!ph.reg;
  drawDet();
}
function setEdit(on){edit=on;$('dEdit').setAttribute('aria-pressed',on);$('dEdit').textContent=on?'Dibujando… (cancelar)':'Editar recuadro';$('dMsg').hidden=!on;}
function sizeDet(){const d=window.devicePixelRatio||1,r=det.getBoundingClientRect();dc.width=Math.max(1,Math.round(r.width*d));dc.height=Math.max(1,Math.round(r.height*d));drawDet();}
new ResizeObserver(()=>{if(!det.hidden)sizeDet();}).observe($('stage'));
function geom(){
  const W=work.width,H=work.height, fit=Math.min(dc.width/W,dc.height/H), s=fit*V.z;
  return {s,ox:(dc.width-W*s)/2+V.px,oy:(dc.height-H*s)/2+V.py,W,H};
}
function drawDet(){
  const x=dc.getContext('2d'); x.clearRect(0,0,dc.width,dc.height); if(!work) return;
  const g=geom(); x.imageSmoothingQuality='high';
  x.drawImage(showOrig?work:comp,g.ox,g.oy,g.W*g.s,g.H*g.s);
  const dpr=window.devicePixelRatio||1, ph=photos[cur];
  let r=null;
  if(drawRect){r=normRect(drawRect);}
  else if(ph.reg){r={x:ph.reg.x*g.W,y:ph.reg.y*g.H,w:ph.reg.w*g.W,h:ph.reg.h*g.H};}
  if(r){
    x.setLineDash(drawRect?[]:[6*dpr,5*dpr]); x.strokeStyle='#F2A900'; x.lineWidth=2*dpr;
    x.strokeRect(g.ox+r.x*g.s,g.oy+r.y*g.s,r.w*g.s,r.h*g.s); x.setLineDash([]);
  }
}
const normRect=d=>({x:Math.min(d.x0,d.x1),y:Math.min(d.y0,d.y1),w:Math.abs(d.x1-d.x0),h:Math.abs(d.y1-d.y0)});
function scr(e){const b=dc.getBoundingClientRect(),d=window.devicePixelRatio||1;return{x:(e.clientX-b.left)*d,y:(e.clientY-b.top)*d};}
function toImg(p){const g=geom();return{x:Math.max(0,Math.min(g.W,(p.x-g.ox)/g.s)),y:Math.max(0,Math.min(g.H,(p.y-g.oy)/g.s))};}
function zoomAt(p,z){
  const g=geom(), ix=(p.x-g.ox)/g.s, iy=(p.y-g.oy)/g.s;
  V.z=Math.max(1,Math.min(8,z));
  if(V.z===1){V.px=0;V.py=0;return;}
  const fit=Math.min(dc.width/g.W,dc.height/g.H), s=fit*V.z;
  V.px=(p.x-ix*s)-(dc.width-g.W*s)/2; V.py=(p.y-iy*s)-(dc.height-g.H*s)/2;
}
const ptrs=new Map(); let gest=null, lastTap=0;
dc.addEventListener('pointerdown',e=>{
  dc.setPointerCapture(e.pointerId); const p=scr(e); ptrs.set(e.pointerId,p);
  if(edit&&ptrs.size===1){const q=toImg(p);drawRect={x0:q.x,y0:q.y,x1:q.x,y1:q.y};gest={t:'draw'};return;}
  if(ptrs.size===2){drawRect=null;const [a,b]=[...ptrs.values()];gest={t:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y),z:V.z};return;}
  if(ptrs.size===1) gest={t:'one',sx:p.x,sy:p.y,px:V.px,py:V.py,time:Date.now(),moved:false};
});
dc.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)||!gest) return; const p=scr(e); ptrs.set(e.pointerId,p);
  if(gest.t==='draw'){const q=toImg(p);drawRect.x1=q.x;drawRect.y1=q.y;drawDet();return;}
  if(gest.t==='pinch'&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt({x:(a.x+b.x)/2,y:(a.y+b.y)/2},gest.z*d/gest.d);gest.d=d;gest.z=V.z;drawDet();return;}
  if(gest.t==='one'){
    const dx=p.x-gest.sx, dy=p.y-gest.sy; if(Math.hypot(dx,dy)>12*(window.devicePixelRatio||1)) gest.moved=true;
    if(V.z>1){V.px=gest.px+dx;V.py=gest.py+dy;drawDet();}
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId)) return; const p=scr(e); ptrs.delete(e.pointerId);
  if(!gest) return;
  if(gest.t==='draw'){
    const r=normRect(drawRect); drawRect=null; gest=null;
    if(r.w<work.width/80||r.h<work.height/120){toast('Recuadro muy chico, vuelve a arrastrar');drawDet();return;}
    photos[cur].reg={x:r.x/work.width,y:r.y/work.height,w:r.w/work.width,h:r.h/work.height};
    setEdit(false); comp=compose(work,photos[cur].reg,P); refreshCard(cur,true); updDetUI(); updateSummary();
    return;
  }
  if(gest.t==='pinch'){if(ptrs.size===0)gest=null;return;}
  if(gest.t==='one'){
    const dx=p.x-gest.sx, dy=p.y-gest.sy, d=window.devicePixelRatio||1;
    if(!gest.moved){
      const now=Date.now();
      if(now-lastTap<320){lastTap=0;zoomAt(p,V.z>1?1:2.5);drawDet();}
      else lastTap=now;
    }else if(V.z===1&&Math.abs(dx)>60*d&&Math.abs(dx)>Math.abs(dy)*1.5){
      go(dx<0?1:-1);
    }
    gest=null;
  }
}
dc.addEventListener('pointerup',endPtr);
dc.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);gest=null;drawRect=null;drawDet();});
dc.addEventListener('contextmenu',e=>e.preventDefault());

function go(step){const n=cur+step;if(n>=0&&n<photos.length)openDetail(n);}
$('dPrev').onclick=()=>go(-1);
$('dNext').onclick=()=>go(1);
$('dClose').onclick=closeDetail;
$('dEdit').onclick=()=>{setEdit(!edit);drawRect=null;drawDet();};
$('dClear').onclick=()=>{const ph=photos[cur];if(!ph.reg)return;ph.reg=null;comp=compose(work,null,P);refreshCard(cur,true);updDetUI();updateSummary();};
$('dInc').onclick=()=>{const ph=photos[cur];ph.inc=!ph.inc;refreshCard(cur,false);updDetUI();updateSummary();};
const bo=$('dOrig');
bo.addEventListener('pointerdown',()=>{showOrig=true;drawDet();});
['pointerup','pointerleave','pointercancel'].forEach(ev=>bo.addEventListener(ev,()=>{if(showOrig){showOrig=false;drawDet();}}));

/* ---------- filtros y ajuste ---------- */
function buildChips(){
  const box=$('chips'); box.innerHTML='';
  PRESETS.forEach(pr=>{const b=document.createElement('button');b.className='chip'+(pr.id===presetId?' on':'');b.textContent=pr.name;
    b.onclick=()=>{presetId=pr.id;P={...pr};buildChips();buildSliders();applyFilter();};box.appendChild(b);});
}
function buildSliders(){
  const box=$('pA'); box.innerHTML='';
  const t=document.createElement('div'); t.className='chips'; t.style.marginBottom='10px';
  TG.forEach(g=>{const b=document.createElement('button');b.className='chip'+(P[g.k]?' on':'');b.textContent=g.label;
    b.onclick=()=>{P[g.k]=!P[g.k];b.classList.toggle('on',!!P[g.k]);applyFilter();};t.appendChild(b);});
  box.appendChild(t);
  SL.forEach(s=>{
    const w=document.createElement('div'); w.className='sl';
    w.innerHTML='<div class="r"><label for="r_'+s.k+'">'+s.label+'</label><output></output></div><input type="range" id="r_'+s.k+'" min="'+s.min+'" max="'+s.max+'" step="'+s.step+'">';
    const r=w.querySelector('input'), o=w.querySelector('output'); r.value=P[s.k]; o.textContent=P[s.k];
    r.oninput=()=>{P[s.k]=+r.value;o.textContent=r.value;applyDetailOnly();};
    r.onchange=()=>applyFilter();
    box.appendChild(w);
  });
  const rb=document.createElement('button'); rb.className='fbtn'; rb.style.width='100%';
  rb.textContent='Regresar al filtro "'+PRESETS.find(p=>p.id===presetId).name+'"';
  rb.onclick=()=>{P={...PRESETS.find(p=>p.id===presetId)};buildSliders();applyFilter();};
  box.appendChild(rb);
}
let ad=0;
function applyDetailOnly(){clearTimeout(ad);ad=setTimeout(()=>{if(work&&cur>=0){comp=compose(work,photos[cur].reg,P);drawDet();}},40);}
function applyFilter(){applyDetailOnly();refreshAll();}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(o=>{const on=o===t;o.setAttribute('aria-selected',on);$(o.dataset.p).hidden=!on;});
});

/* ---------- guardar ---------- */
function updateSummary(){
  const inc=photos.filter(p=>p.inc), ready=inc.filter(p=>p.reg), noReg=inc.length-ready.length;
  $('count').textContent=photos.length?(photos.length+' fotos · '+ready.length+' listas'):'';
  $('sum').innerHTML=photos.length?('<b>'+ready.length+'</b> foto(s) listas para guardar con el filtro <b>'+PRESETS.find(p=>p.id===presetId).name+'</b>.'):'Primero elige fotos.';
  $('bSave').disabled=!ready.length; $('bSave').textContent=ready.length?('Guardar '+ready.length+' foto'+(ready.length>1?'s':'')):'Guardar';
  const w=$('sWarn'); w.hidden=!noReg; w.textContent=noReg?(noReg+' foto(s) marcadas no tienen recuadro y no se guardarán. Ábrelas y dibuja el recuadro, o desmárcalas.'):'';
}
// Copia la información EXIF (fecha, GPS) de la original a la nueva, con orientación normal
async function exifSeg(file){
  try{
    const b=new Uint8Array(await file.slice(0,262144).arrayBuffer());
    if(b[0]!==0xFF||b[1]!==0xD8) return null;
    let o=2;
    while(o+4<b.length&&b[o]===0xFF){
      const t=b[o+1], len=(b[o+2]<<8)|b[o+3];
      if(t===0xDA) break;
      if(t===0xE1&&b[o+4]===0x45&&b[o+5]===0x78&&b[o+6]===0x69&&b[o+7]===0x66){
        if(o+2+len>b.length) return null;
        const seg=b.slice(o,o+2+len), T=10, le=seg[T]===0x49;
        const r16=i=>le?seg[i]|(seg[i+1]<<8):(seg[i]<<8)|seg[i+1];
        const r32=i=>le?(seg[i]|(seg[i+1]<<8)|(seg[i+2]<<16))+seg[i+3]*16777216:seg[i]*16777216+((seg[i+1]<<16)|(seg[i+2]<<8)|seg[i+3]);
        const ifd=T+r32(T+4), n=r16(ifd);
        for(let k=0;k<n;k++){const e=ifd+2+12*k;if(r16(e)===0x0112){if(le){seg[e+8]=1;seg[e+9]=0;}else{seg[e+8]=0;seg[e+9]=1;}}}
        return seg;
      }
      o+=2+len;
    }
  }catch(e){}
  return null;
}
async function withExif(blob,file){
  const seg=await exifSeg(file); if(!seg) return blob;
  const j=new Uint8Array(await blob.arrayBuffer());
  return new Blob([j.slice(0,2),seg,j.slice(2)],{type:'image/jpeg'});
}
const toBlob=c=>new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(),'image/jpeg',0.92));
function download(blob,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),8000);
}
$('bSave').onclick=async()=>{
  const list=photos.filter(p=>p.inc&&p.reg); if(!list.length) return;
  let ok=0;
  for(let k=0;k<list.length;k++){
    const ph=list[k];
    busy('Guardando foto '+(k+1)+' de '+list.length+'…'); await frame();
    try{
      const base=await toCanvas(ph.file,SAVE_MAX);
      const out=compose(base,ph.reg,P);
      let blob=await toBlob(out); blob=await withExif(blob,ph.file);
      const nm=(ph.file.name||('foto_'+(k+1))).replace(/\.[^.]+$/,'')+'_mjr.jpg';
      download(blob,nm); ok++;
      await sleep(700);
    }catch(e){}
  }
  busy();
  toast(ok+' foto(s) guardadas. Búscalas en Galería → álbum Download.',5000);
};

buildChips(); buildSliders(); updateSummary();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
})();
</script>
